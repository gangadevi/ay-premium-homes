<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Careers | AY Premium Homes</title>
  <meta name="description" content="Join the team building AY Premium Homes' luxury developments.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">

  <!-- Base path config + shared favicon/project CSS (see assets/js/config.js) -->
  <script src="../assets/js/config.js"></script>
</head>
<body data-page="careers">

  <div id="site-header"></div>

  <main class="ay-page-main">

    <section class="ay-page-hero ay-page-hero--clean" aria-labelledby="careers-heading">
      <h1 class="visually-hidden" id="careers-heading">Build with us</h1>
      <div class="ay-page-hero__media">
        <img src="/assets/images/career/CareerPage.jpg" alt="AY Premium Homes team collaborating around a table in a modern office" width="1920" height="1080" loading="eager" fetchpriority="high" decoding="async">
      </div>
    </section>

    <!-- ================= LIFE AT AY ================= -->
    <section class="ay-section bg-linen" aria-labelledby="culture-heading">
      <div class="container-ay">
        <h2 id="culture-heading">Life at AY Premium Homes</h2>
        <!-- TODO: culture copy + photo grid -->
      </div>
    </section>

    <!-- ================= OPEN POSITIONS ================= -->
    <section class="ay-section bg-travertine" aria-labelledby="openings-heading">
      <div class="container-ay">
        <h2 id="openings-heading">Open positions</h2>
        <div class="list-group" data-openings-list>
          <!-- TODO: repeat .list-group-item per job opening -->
          <article class="list-group-item" data-aos="fade-up">
            <h3>Job Title</h3>
            <p class="ay-coord">Department &mdash; Location &mdash; Type</p>
          </article>
        </div>
      </div>
    </section>

    <!-- ================= APPLICATION FORM ================= -->
    <section class="ay-section bg-soft-gold-gradient" aria-labelledby="apply-heading">
      <div class="container-ay">
        <h2 id="apply-heading">Apply</h2>
        <!-- TODO: application form — bind via assets/js/email.js following the
             same pattern as #enquiryForm / #contactForm if a dedicated
             careers template is added to EMAILJS_CONFIG -->
      </div>
    </section>

  </main>

  <div id="site-footer"></div>
  <div id="enquiry-modal-root"></div>
  <div id="floating-buttons-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- Project JS (loaded through BASE_PATH so this works unmodified on
       localhost, a GitHub Pages project site, and a custom domain — see
       assets/js/config.js) -->
  <script>
    (function () {
      var BASE_PATH = window.BASE_PATH || "";
      ["/assets/js/main.js", "/assets/js/swiper.js", "/assets/js/email.js"].forEach(function (path) {
        var script = document.createElement("script");
        script.src = BASE_PATH + path;
        script.async = false;
        document.body.appendChild(script);
      });
    })();
  </script>
</body>
</html>
