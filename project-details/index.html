<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details | AY Premium Homes</title>
  <link rel="icon" type="image/png" href="/assets/images/logo/Web_AY_Logo.png">
  <meta name="description" content="Detailed specifications, gallery and floor plans for this AY Premium Homes development.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">

  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body data-page="projects">
  <!-- data-page stays "projects" so the Projects nav link highlights as active -->

  <div id="site-header"></div>

  <main class="ay-page-main">

    <!-- ================= PROJECT GALLERY (Swiper) ================= -->
    <section aria-label="Project gallery">
      <div class="swiper js-detail-gallery">
        <div class="swiper-wrapper">
          <!-- TODO: repeat .swiper-slide per gallery image -->
          <div class="swiper-slide">
            <img src="/assets/images/projects/ProjectPageBanner_3.png" alt="Luxury villas at dusk in Huskur, illuminated pathways and private balconies" width="1920" height="1080" loading="eager" fetchpriority="high" decoding="async">
          </div>
          <div class="swiper-slide">
            <img src="/assets/images/projects/ProjectPageBanner_2.jpg" alt="Illustration of the 270-degree cross-ventilation design across the Huskur residences" width="1920" height="1080" loading="lazy" decoding="async">
          </div>
        </div>
        <div class="swiper-button-prev" aria-label="Previous image"></div>
        <div class="swiper-button-next" aria-label="Next image"></div>
      </div>
    </section>

    <!-- ================= PROJECT HEADER ================= -->
    <section class="ay-section bg-warm-ivory" aria-labelledby="project-heading">
      <div class="container-ay">
        <p class="ay-eyebrow">Project</p>
        <h1 id="project-heading" data-aos="fade-up">Project Name</h1>
        <p class="ay-coord">Reference: PRJ-DETAIL &mdash; /PROJECT-DETAILS/</p>
        <button type="button" class="ay-btn ay-btn--primary" data-enquiry-trigger>Enquire About This Project</button>
      </div>
    </section>

    <!-- ================= OVERVIEW ================= -->
    <section class="ay-section bg-marble" aria-labelledby="overview-heading">
      <div class="container-ay">
        <h2 id="overview-heading">Overview</h2>
        <!-- TODO: project description copy -->
      </div>
    </section>

    <!-- ================= SPECIFICATIONS ================= -->
    <section class="ay-section bg-linen" aria-labelledby="specs-heading">
      <div class="container-ay">
        <h2 id="specs-heading">Specifications</h2>
        <dl class="row">
          <!-- TODO: repeat dt/dd pairs for configuration, area, possession, RERA no. etc -->
          <dt class="col-sm-3 ay-coord">Configuration</dt>
          <dd class="col-sm-9">—</dd>
        </dl>
      </div>
    </section>

    <!-- ================= AMENITIES ================= -->
    <section class="ay-section ay-section--dark" aria-labelledby="amenities-heading">
      <div class="container-ay">
        <h2 id="amenities-heading">Amenities</h2>
        <div class="row g-4">
          <!-- TODO: repeat .col per amenity icon/label -->
          <div class="col-md-3" data-aos="fade-up"><i class="bi bi-water" aria-hidden="true"></i><p>Amenity</p></div>
        </div>
      </div>
    </section>

    <!-- ================= LOCATION / MAP ================= -->
    <section class="ay-section bg-travertine" aria-labelledby="location-heading">
      <div class="container-ay">
        <h2 id="location-heading">Location</h2>
        <!-- TODO: embed map + nearby landmarks -->
      </div>
    </section>

  </main>

  <div id="site-footer"></div>
  <div id="enquiry-modal-root"></div>
  <div id="floating-buttons-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/swiper.js"></script>
  <script src="/assets/js/email.js"></script>
</body>
</html>
